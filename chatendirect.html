    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            margin: 40px auto;
            max-width: 400px;
            padding: 10px;
        }

        /* Conteneur principal du chat */
        .chat-container {
            background: #242526;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            overflow: hidden;
            border: 1px solid #3a3b3c;
        }

        /* En-tête du chat */
        .chat-header {
            background: #2f3031;
            padding: 12px;
            color: #e4e6eb;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #3a3b3c;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #e41e3f;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1s infinite;
        }

        /* Zone de défilement des messages */
        #chatbox {
            height: 350px;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Style des messages individuels */
        .msg {
            font-size: 13.5px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease-in-out;
            color: #e4e6eb;
        }

        .pseudo {
            font-weight: bold;
            color: #45bd62; /* Couleur verte style gamer / bot */
            margin-right: 5px;
        }

        /* Zone de texte bloquée en bas */
        .chat-footer {
            padding: 15px;
            background: #2f3031;
            border-top: 1px solid #3a3b3c;
            text-align: center;
        }

        .lock-message {
            color: #f5c518;
            font-weight: bold;
            font-size: 13px;
            background: rgba(245, 197, 24, 0.1);
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed #f5c518;
        }

        /* Animations */
        @keyframes blink {
            0% {
                opacity: 0.2;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.2;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
